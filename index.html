<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cookmoji 私有作品发布后分享 Demo</title>
  <meta name="description" content="Cookmoji 私有作品发布后分享方案 A 交互 Demo" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f4cb16'/%3E%3Cpath d='M18 34h21m0 0-8-8m8 8-8 8' fill='none' stroke='%23181818' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='47' cy='18' r='7' fill='%237a58e8'/%3E%3C/svg%3E" />
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;color:#171717;background:#f1f2f5}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#fff 0,#f4f5f7 34%,#e9ebef 100%)}
    header{max-width:1120px;margin:0 auto;padding:34px 24px 14px;display:flex;align-items:end;justify-content:space-between;gap:20px}
    h1{font-size:28px;margin:0 0 7px;letter-spacing:-.02em} header p{margin:0;color:#666;font-size:15px;line-height:1.5}
    .legend{font-size:13px;color:#676767;background:#fff;border:1px solid #e4e4e4;border-radius:999px;padding:9px 13px;white-space:nowrap}
    main{max-width:760px;margin:0 auto;padding:18px 24px 48px;display:block}
    .case{background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.06);box-shadow:0 16px 50px rgba(31,34,41,.09);border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;position:relative;transition:.2s ease}
    .case.selected{border:2px solid #e7bc00;background:#fff;box-shadow:0 18px 58px rgba(219,175,0,.2)}
    .case.selected:before{content:"方案 A";position:absolute;top:-13px;left:24px;background:#f3cb19;color:#171717;border:2px solid #fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:800;box-shadow:0 5px 15px rgba(117,91,0,.2);z-index:10}
    .case-head{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
    .case h2{font-size:19px;margin:0 0 5px}.case p{font-size:13px;color:#727272;line-height:1.5;margin:0}.tag{font-size:12px;font-weight:700;padding:6px 9px;border-radius:9px;background:#fff4bb;color:#6f5800;white-space:nowrap}.tag.chosen{background:#f3cb19;color:#171717}.tag.archived{background:#e7e8eb;color:#6c6e73}
    .phone{width:min(100%,390px);aspect-ratio:390/844;border:10px solid #181818;border-radius:46px;background:#fff;position:relative;overflow:hidden;box-shadow:0 22px 44px rgba(0,0,0,.18)}
    .wallpaper{position:absolute;inset:0;background:url('./assets/current-flow.png') center top/cover no-repeat;filter:saturate(.92)}
    .veil{position:absolute;inset:0;background:rgba(255,255,255,.1);pointer-events:none}
    .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:12px 18px 24px;box-shadow:0 -8px 28px rgba(0,0,0,.13);transition:.25s ease}
    .grab{width:42px;height:5px;background:#c8c8ca;border-radius:99px;margin:0 auto 14px}.sheet-title{display:flex;align-items:center;justify-content:space-between;font-weight:750;font-size:18px;margin-bottom:18px}.x{border:0;background:#f3f3f5;width:38px;height:38px;border-radius:50%;font-size:22px}
    .targets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.target{border:0;background:transparent;padding:0;color:#1c1c1e;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}.disc{width:57px;height:57px;border-radius:50%;background:#f3f4f6;display:grid;place-items:center;font-size:22px;transition:.2s}.target:hover .disc{transform:translateY(-2px);background:#eceef2}.target.primary .disc{background:#fff6bf}.target.primary{font-weight:700}.rule{height:1px;background:#ececec;margin:18px 0 16px}.apps{display:flex;gap:26px;align-items:flex-start}.app{font-size:12px;text-align:center}.logo{width:55px;height:55px;border-radius:15px;display:grid;place-items:center;color:white;font-size:25px;font-weight:800;margin-bottom:7px}.tg{background:#29a9e8}.wa{background:#31d367}.im{background:linear-gradient(#67ef82,#38c85d)}
    .modal-wrap{position:absolute;inset:0;background:rgba(0,0,0,.36);display:none;place-items:center;padding:22px;z-index:5}.modal-wrap.show{display:grid}.modal{width:100%;background:rgba(255,255,255,.98);border-radius:23px;padding:22px;text-align:center;box-shadow:0 22px 70px rgba(0,0,0,.3)}.modal .globe{width:52px;height:52px;border-radius:16px;background:#fff4b4;display:grid;place-items:center;margin:0 auto 13px;font-size:27px}.modal h3{margin:0 0 9px;font-size:20px}.modal p{font-size:14px;color:#5f6066;line-height:1.55;margin:0 0 18px}.warning{background:#fff8d8;border-radius:12px;padding:10px 11px;color:#705c00!important;text-align:left!important;font-size:12px!important}.actions{display:flex;gap:10px;margin-top:17px}.btn{height:48px;border:0;border-radius:14px;font-size:15px;font-weight:750;flex:1;cursor:pointer}.btn.secondary{background:#f0f1f3}.btn.primary{background:#f3cb19;color:#171717}.btn:active{transform:scale(.98)}
    .loading{position:absolute;inset:0;background:rgba(255,255,255,.97);display:none;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center;z-index:6}.loading.show{display:flex}.spinner{width:58px;height:58px;border:5px solid #ececec;border-top-color:#f2c916;border-radius:50%;animation:spin .85s linear infinite;margin-bottom:21px}.loading h3{font-size:20px;margin:0 0 9px}.loading p{font-size:14px;line-height:1.55;color:#666;margin:0}.progress{width:100%;height:7px;background:#eee;border-radius:99px;overflow:hidden;margin:24px 0 12px}.progress span{display:block;width:15%;height:100%;background:#f2c916;border-radius:99px;animation:progress 2.4s ease forwards}.loading small{color:#8a8a8f}.success{font-size:54px;margin-bottom:14px}.reset{margin-top:14px;border:0;background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.09)}
    .direct-note{position:absolute;top:89px;left:18px;right:18px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-radius:15px;padding:12px 14px;font-size:12px;color:#555;box-shadow:0 6px 20px rgba(0,0,0,.1);z-index:2}.direct-note strong{display:block;color:#1c1c1e;font-size:14px;margin-bottom:3px}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes progress{to{width:100%}}
    @media(max-width:820px){header{align-items:flex-start;flex-direction:column}.legend{white-space:normal}main{grid-template-columns:1fr}.phone{width:min(100%,370px)}}
  </style>
</head>
<body>
  <header><div><h1>私有作品 · 发布后分享</h1><p>适用于本人尚未发布的作品；已发布作品继续沿用现有“复制邀请码”流程。</p></div><div class="legend">Quick PRD · 方案 A</div></header>
  <main>
    <section class="case selected">
      <div class="case-head"><div><h2>发布前明确告知，再由用户确认</h2><p>私有作品不直接复制不可访问的邀请码；确认后完成“发布到广场 + 复制邀请码”。</p></div><span class="tag chosen">已确认方案</span></div>
      <div class="phone" id="phone-a">
        <div class="wallpaper"></div><div class="veil"></div>
        <div class="sheet">
          <div class="grab"></div><div class="sheet-title"><span>舞台歌手日常</span><button class="x">×</button></div>
          <div class="targets">
            <button class="target primary" data-action="confirm"><span class="disc">🌐</span><span>发布后分享</span></button>
            <button class="target"><span class="disc">▧</span><span>相册</span></button><button class="target"><span class="disc">▱</span><span>文件</span></button><button class="target"><span class="disc">↑</span><span>其他</span></button>
          </div><div class="rule"></div><div class="apps"><div class="app"><div class="logo tg">➤</div>Telegram</div><div class="app"><div class="logo wa">◔</div>WhatsApp</div><div class="app"><div class="logo im">●</div>iMessage</div></div>
        </div>
        <div class="modal-wrap"><div class="modal"><div class="globe">🌐</div><h3>发布后才能分享作品</h3><p>作品将公开展示在广场，其他用户可以通过邀请码查看。之后可以随时撤回发布。</p><p class="warning">原始照片不会公开；发布的是这套贴纸作品。</p><div class="actions"><button class="btn secondary" data-close>取消</button><button class="btn primary" data-publish>发布并复制邀请码</button></div></div></div>
        <div class="loading"><div class="spinner"></div><h3>正在发布…</h3><p>发布成功后会自动复制邀请码，请稍候。</p><div class="progress"><span></span></div><small>处理期间请勿重复操作</small></div>
      </div><button class="reset" data-reset="phone-a">重置演示</button>
    </section>
  </main>
  <script>
    const run=(phone)=>{const loading=phone.querySelector('.loading');loading.classList.add('show');setTimeout(()=>{loading.innerHTML='<div class="success">✓</div><h3>已发布到广场，邀请码已复制</h3><p>现在可以直接粘贴邀请码发送给朋友。</p>'},2450)};
    document.querySelector('[data-action="confirm"]').onclick=()=>document.querySelector('#phone-a .modal-wrap').classList.add('show');
    document.querySelector('#phone-a [data-close]').onclick=()=>document.querySelector('#phone-a .modal-wrap').classList.remove('show');
    document.querySelector('#phone-a [data-publish]').onclick=()=>{document.querySelector('#phone-a .modal-wrap').classList.remove('show');run(document.querySelector('#phone-a'))};
    document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>location.reload());
  </script>
</body>
</html>
