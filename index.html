<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cookmoji 私有作品发布后分享 Demo</title>
  <meta name="description" content="Cookmoji 私有作品发布后分享方案 A 交互 Demo" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f4cb16'/%3E%3Cpath d='M18 34h21m0 0-8-8m8 8-8 8' fill='none' stroke='%23181818' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='47' cy='18' r='7' fill='%237a58e8'/%3E%3C/svg%3E" />
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;color:#171717;background:#f1f2f5}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 0,#fff 0,#f4f5f7 34%,#e9ebef 100%)}
    main,.case{display:grid;place-items:center;width:100%}
    .phone{width:min(100%,390px);aspect-ratio:390/844;border:10px solid #181818;border-radius:46px;background:#fff;position:relative;overflow:hidden;box-shadow:0 22px 44px rgba(0,0,0,.18)}
    .wallpaper{position:absolute;inset:0;background:url('./assets/private-share.jpg') center/cover no-repeat;transition:opacity .22s ease}
    .phone.public .wallpaper{background-image:url('./assets/public-share.jpg')}
    .veil{position:absolute;inset:0;background:rgba(255,255,255,.03);pointer-events:none}
    .hotspot{position:absolute;z-index:2;left:5%;top:65%;width:24%;height:18%;border:0;border-radius:20px;background:transparent;cursor:pointer}.hotspot:focus-visible{outline:3px solid #7957e8;outline-offset:-3px}.public-hotspot{display:none}.phone.public .private-hotspot{display:none}.phone.public .public-hotspot{display:block}
    .toast{position:absolute;z-index:7;top:12%;left:50%;width:max-content;max-width:82%;transform:translate(-50%,-12px);border-radius:999px;background:rgba(28,28,30,.9);color:#fff;padding:11px 15px;font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:.22s ease}.toast.show{opacity:1;transform:translate(-50%,0)}
    .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:12px 18px 24px;box-shadow:0 -8px 28px rgba(0,0,0,.13);transition:.25s ease}
    .grab{width:42px;height:5px;background:#c8c8ca;border-radius:99px;margin:0 auto 14px}.sheet-title{display:flex;align-items:center;justify-content:space-between;font-weight:750;font-size:18px;margin-bottom:18px}.x{border:0;background:#f3f3f5;width:38px;height:38px;border-radius:50%;font-size:22px}
    .targets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.target{border:0;background:transparent;padding:0;color:#1c1c1e;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}.disc{width:57px;height:57px;border-radius:50%;background:#f3f4f6;display:grid;place-items:center;font-size:22px;transition:.2s}.target:hover .disc{transform:translateY(-2px);background:#eceef2}.target.primary .disc{background:#fff6bf}.target.primary{font-weight:700}.rule{height:1px;background:#ececec;margin:18px 0 16px}.apps{display:flex;gap:26px;align-items:flex-start}.app{font-size:12px;text-align:center}.logo{width:55px;height:55px;border-radius:15px;display:grid;place-items:center;color:white;font-size:25px;font-weight:800;margin-bottom:7px}.tg{background:#29a9e8}.wa{background:#31d367}.im{background:linear-gradient(#67ef82,#38c85d)}
    .modal-wrap{position:absolute;inset:0;background:rgba(0,0,0,.36);display:none;place-items:center;padding:22px;z-index:5}.modal-wrap.show{display:grid}.modal{width:100%;background:rgba(255,255,255,.98);border-radius:23px;padding:22px;text-align:center;box-shadow:0 22px 70px rgba(0,0,0,.3)}.modal .globe{width:52px;height:52px;border-radius:16px;background:#fff4b4;display:grid;place-items:center;margin:0 auto 13px;font-size:27px}.modal h3{margin:0 0 9px;font-size:20px}.modal p{font-size:14px;color:#5f6066;line-height:1.55;margin:0 0 18px}.warning{background:#fff8d8;border-radius:12px;padding:10px 11px;color:#705c00!important;text-align:left!important;font-size:12px!important}.actions{display:flex;gap:10px;margin-top:17px}.btn{height:48px;border:0;border-radius:14px;font-size:15px;font-weight:750;flex:1;cursor:pointer}.btn.secondary{background:#f0f1f3}.btn.primary{background:#f3cb19;color:#171717}.btn:active{transform:scale(.98)}
    .loading{position:absolute;inset:0;background:rgba(255,255,255,.97);display:none;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center;z-index:6}.loading.show{display:flex}.spinner{width:58px;height:58px;border:5px solid #ececec;border-top-color:#f2c916;border-radius:50%;animation:spin .85s linear infinite;margin-bottom:21px}.loading h3{font-size:20px;margin:0 0 9px}.loading p{font-size:14px;line-height:1.55;color:#666;margin:0}.progress{width:100%;height:7px;background:#eee;border-radius:99px;overflow:hidden;margin:24px 0 12px}.progress span{display:block;width:15%;height:100%;background:#f2c916;border-radius:99px;animation:progress 2.4s ease forwards}.loading small{color:#8a8a8f}.success{font-size:54px;margin-bottom:14px}
    .direct-note{position:absolute;top:89px;left:18px;right:18px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-radius:15px;padding:12px 14px;font-size:12px;color:#555;box-shadow:0 6px 20px rgba(0,0,0,.1);z-index:2}.direct-note strong{display:block;color:#1c1c1e;font-size:14px;margin-bottom:3px}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes progress{to{width:100%}}
    @media(max-width:500px){body{padding:0;background:#fff}.phone{width:100%;height:100dvh;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <main>
    <section class="case">
      <div class="phone" id="phone-a">
        <div class="wallpaper"></div><div class="veil"></div>
        <button class="hotspot private-hotspot" data-action="confirm" aria-label="发布后分享"></button>
        <button class="hotspot public-hotspot" data-action="copy" aria-label="复制邀请"></button>
        <div class="modal-wrap"><div class="modal"><div class="globe">🌐</div><h3>发布后才能分享作品</h3><p>作品将公开展示在广场，其他用户可以通过邀请码查看。之后可以随时撤回发布。</p><p class="warning">原始照片不会公开；发布的是这套贴纸作品。</p><div class="actions"><button class="btn secondary" data-close>取消</button><button class="btn primary" data-publish>发布并复制邀请码</button></div></div></div>
        <div class="loading"><div class="spinner"></div><h3>正在发布…</h3><p>发布成功后会自动复制邀请码，请稍候。</p><div class="progress"><span></span></div><small>处理期间请勿重复操作</small></div>
        <div class="toast" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script>
    const phone=document.querySelector('#phone-a');
    const toast=(message)=>{const el=phone.querySelector('.toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)};
    const run=()=>{const loading=phone.querySelector('.loading');loading.classList.add('show');setTimeout(()=>{loading.classList.remove('show');phone.classList.add('public');toast('已发布到广场，邀请码已复制')},2450)};
    phone.querySelector('[data-action="confirm"]').onclick=()=>phone.querySelector('.modal-wrap').classList.add('show');
    phone.querySelector('[data-close]').onclick=()=>phone.querySelector('.modal-wrap').classList.remove('show');
    phone.querySelector('[data-publish]').onclick=()=>{phone.querySelector('.modal-wrap').classList.remove('show');run()};
    phone.querySelector('[data-action="copy"]').onclick=()=>toast('邀请码已复制');
  </script>
</body>
</html>
